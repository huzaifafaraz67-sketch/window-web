<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web OS</title>
  <!-- Stylesheets -->
  <link rel="stylesheet" href="12k/45h.css">
  <link rel="stylesheet" href="12k/92m.css">
  <link rel="stylesheet" href="12k/10x.css">
</head>
<body>

  <!-- Desktop Environment -->
  <div id="desktop">
    
    <!-- Desktop Shortcuts with Vector Graphics -->
    <div class="shortcut-grid">
      <div class="shortcut" onclick="openWindow('word-window')">
        <svg width="48" height="48" viewBox="0 0 48 48" style="border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
          <rect width="48" height="48" fill="#185abd" rx="8"/>
          <path d="M 14 12 L 20 36 L 25 20 L 30 36 L 36 12" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span>Word Clone</span>
      </div>

      <div class="shortcut" onclick="openWindow('excel-window')">
        <svg width="48" height="48" viewBox="0 0 48 48" style="border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
          <rect width="48" height="48" fill="#107c41" rx="8"/>
          <path d="M 14 12 L 34 36 M 34 12 L 14 36" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span>Excel Clone</span>
      </div>

      <div class="shortcut" onclick="openWindow('ppt-window')">
        <svg width="48" height="48" viewBox="0 0 48 48" style="border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
          <rect width="48" height="48" fill="#c4391d" rx="8"/>
          <path d="M 16 12 L 26 12 C 32 12 32 24 26 24 L 16 24 Z M 16 24 L 16 36" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <span>PowerPoint</span>
      </div>
    </div>

    <!-- Active App Windows Containers -->
    <div id="window-container"></div>

  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <button id="start-btn" onclick="toggleStartMenu()">
      <!-- Windows-style Logo SVG -->
      <svg width="16" height="16" viewBox="0 0 16 16" fill="#ffffff">
        <rect x="0" y="0" width="7.5" height="7.5"/>
        <rect x="8.5" y="0" width="7.5" height="7.5"/>
        <rect x="0" y="8.5" width="7.5" height="7.5"/>
        <rect x="8.5" y="8.5" width="7.5" height="7.5"/>
      </svg>
      <span>Start</span>
    </button>
    <div id="taskbar-apps"></div>
    <div id="system-tray">
      <span id="clock">00:00 AM</span>
    </div>
  </div>

  <!-- Start Menu -->
  <div id="start-menu" class="hidden">
    <div class="start-header">System Launcher</div>
    <div class="start-items">
      <div class="start-item" onclick="openWindow('word-window')">📄 Document Editor (45w)</div>
      <div class="start-item" onclick="openWindow('excel-window')">📊 Spreadsheet Engine (67x)</div>
      <div class="start-item" onclick="openWindow('ppt-window')">📊 Presentation Deck (89p)</div>
    </div>
  </div>

  <!-- Core Scripts (All subfolder paths corrected) -->
  <script src="94x/01a.js"></script>
  <script src="94x/02b.js"></script>
  <script src="94x/33f/45w.js"></script>
  <script src="94x/33f/67x.js"></script>
  <script src="94x/33f/89p.js"></script>
</body>
</html>
